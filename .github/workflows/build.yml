name: Build and Release

on:
  push:
    branches: [ main, origin ]
  pull_request:
    branches: [ main, origin ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore NuGet packages
        run: dotnet restore XUnity.AutoLLMTranslator.sln

      - name: Build
        shell: pwsh
        run: |
          $gameDir = Join-Path $env:RUNNER_TEMP "GameOutput"
          New-Item -ItemType Directory -Force -Path $gameDir | Out-Null
          dotnet build XUnity.AutoLLMTranslator.sln -c Release --no-restore "/p:GameDir=$gameDir\"
    
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLLMTranslator-Plugin
          path: |
            **/bin/Release/**/XUnity.AutoLLMTranslator.dll
            **/bin/Release/**/Newtonsoft.Json.dll
          if-no-files-found: error
